name: Update market data

# Fetches Taskmarket market data server-side once an hour and commits it.
# The static site never calls the API from the browser (the API blocks
# cross-origin browser requests), so this job is the only data path.
# The data push uses the built-in GITHUB_TOKEN, whose pushes do not
# trigger other workflows, so after committing this job dispatches the
# Deploy workflow explicitly (workflow_dispatch is exempt from that rule).

on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch market data
        run: node scripts/fetch-data.mjs
      - name: Commit data
        run: |
          git config user.name "taskmarket-visualizer-bot"
          git config user.email "bot@taskmarket-visualizer.local"
          git add data/
          git diff --cached --quiet || git commit -m "data: hourly refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
      - name: Trigger deploy
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
